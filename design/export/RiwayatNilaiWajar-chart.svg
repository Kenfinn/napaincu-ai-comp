<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Grafik garis nilai wajar terhadap harga pasar TSMC, Januari sampai September 2026">
        <rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>
        <!-- grid -->
        <line x1="40" y1="480.8" x2="900" y2="480.8" stroke="#EDEFF1" stroke-width="1"/>
        <line x1="40" y1="402.5" x2="900" y2="402.5" stroke="#EDEFF1" stroke-width="1"/>
        <line x1="40" y1="324.2" x2="900" y2="324.2" stroke="#EDEFF1" stroke-width="1"/>
        <line x1="40" y1="245.8" x2="900" y2="245.8" stroke="#EDEFF1" stroke-width="1"/>
        <line x1="40" y1="167.5" x2="900" y2="167.5" stroke="#EDEFF1" stroke-width="1"/>
        <line x1="40" y1="89.2" x2="900" y2="89.2" stroke="#EDEFF1" stroke-width="1"/>
        <line x1="40" y1="520" x2="900" y2="520" stroke="#D5D9DD" stroke-width="1"/>

        <!-- y labels -->
        <text x="32" y="484.5" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">1.900</text>
        <text x="32" y="406.2" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">2.000</text>
        <text x="32" y="327.9" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">2.100</text>
        <text x="32" y="249.5" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">2.200</text>
        <text x="32" y="171.2" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">2.300</text>
        <text x="32" y="92.9" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">2.400</text>

        <!-- overvalued gap -->
        <path d="M588,194.9 L685,159.7 L792.5,136.2 L900,104.8 L900,172.2 L880,172.2 L880,165.9 L685,165.9 Z"
              fill="#B5730C" fill-opacity="0.10"/>

        <!-- fair value, stepped -->
        <path d="M40,261.5 L255,261.5 L255,194.9 L685,194.9 L685,165.9 L880,165.9 L880,172.2 L900,172.2"
              fill="none" stroke="#B5730C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- market price -->
        <path d="M40,449.5 L147.5,394.7 L255,285 L362.5,339.8 L470,253.7 L577.5,198.8 L685,159.7 L792.5,136.2 L900,104.8"
              fill="none" stroke="#2F74C0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- crossing -->
        <line x1="588" y1="194.9" x2="588" y2="520" stroke="#C6CCD3" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="588" cy="194.9" r="5" fill="#FFFFFF" stroke="#596270" stroke-width="2"/>
        <text x="598" y="228" font-family="Instrument Sans, sans-serif" font-size="12" fill="#596270">harga menyalip nilai wajar</text>
        <text x="598" y="245" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#8A929C">28 Jun</text>

        <!-- recalculation markers -->
        <circle cx="255" cy="194.9" r="6" fill="#B5730C" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="685" cy="165.9" r="6" fill="#B5730C" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="880" cy="172.2" r="6" fill="#B5730C" stroke="#FFFFFF" stroke-width="2"/>

        <text x="255" y="182" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#B5730C">1</text>
        <text x="685" y="153" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#B5730C">2</text>
        <text x="880" y="194" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#B5730C">3</text>

        <!-- end points + direct labels -->
        <circle cx="900" cy="104.8" r="5" fill="#2F74C0" stroke="#FFFFFF" stroke-width="2"/>
        <text x="912" y="101" font-family="Instrument Sans, sans-serif" font-size="12" font-weight="600" fill="#2F74C0">Harga</text>
        <text x="912" y="117" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="#101418">2.380</text>

        <circle cx="900" cy="172.2" r="5" fill="#B5730C" stroke="#FFFFFF" stroke-width="2"/>
        <text x="912" y="168" font-family="Instrument Sans, sans-serif" font-size="12" font-weight="600" fill="#B5730C">Nilai wajar</text>
        <text x="912" y="184" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="#101418">2.294</text>

        <!-- x labels -->
        <text x="40" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Jan</text>
        <text x="147.5" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Feb</text>
        <text x="255" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Mar</text>
        <text x="362.5" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Apr</text>
        <text x="470" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Mei</text>
        <text x="577.5" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Jun</text>
        <text x="685" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Jul</text>
        <text x="792.5" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Ags</text>
        <text x="900" y="540" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8A929C">Sep</text>
      </svg>